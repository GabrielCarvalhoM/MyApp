# RepMile V1 CI — portable gates (docs/engineering/QUALITY_GATES.md). Native gates (simulator, iPhone) run on the Mac mini.
# Security: read-only token, no secrets, no Keychain, no signing, no self-hosted runner, never pull_request_target.
name: V1 CI

on:
  push:
    branches: ['claude/v1-**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FOUNDATION_TAG: v1-abc-ready-2026-11-26
  FOUNDATION_SHA: 065178fa91bd4049880466166b186360c6339682

jobs:
  repo:
    name: Repository integrity and ownership
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned actionlint and gitleaks (checksums verified)
        run: |
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint && tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: Workflow syntax
        run: actionlint
      - name: Foundation tag is unmoved
        run: test "$(git rev-parse "$FOUNDATION_TAG^{commit}")" = "$FOUNDATION_SHA"
      - name: Orchestration tooling tests and script syntax
        run: |
          node --test tools/orchestration/tests/*.test.mjs
          for s in tools/orchestration/*.sh tools/device-lock/*.sh; do bash -n "$s"; done
      - name: Ownership guard (contract §10)
        env:
          GUARD_BRANCH: ${{ github.head_ref || github.ref_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          # Approval is bound to the moment the label is applied: a later push (synchronize) runs without it.
          GUARD_APPROVED: ${{ github.event.action == 'labeled' && github.event.label.name == 'governance:approved' && '1' || '0' }}
        run: |
          guard_dir=tools/orchestration
          if [ -n "$PR_BASE_SHA" ] && git cat-file -e "$PR_BASE_SHA:tools/orchestration/guard.mjs" 2>/dev/null; then
            # The PR cannot rewrite the rules it is judged by: run the guard as it is on the target branch.
            mkdir -p "$RUNNER_TEMP/trusted"
            git archive "$PR_BASE_SHA" tools/orchestration | tar -x -C "$RUNNER_TEMP/trusted"
            guard_dir="$RUNNER_TEMP/trusted/tools/orchestration"
            echo "guard from the PR base $PR_BASE_SHA"
          elif [ -n "$PR_BASE_SHA" ]; then
            echo "::warning::the PR base has no guard yet; running the guard from this PR"
          fi
          head=HEAD; [ -n "$PR_HEAD_SHA" ] && head="$PR_HEAD_SHA"   # the PR's own commits, not the merge with its target
          # In a PR, anything not proven to come from this repository is a fork (a deleted fork has no head repo).
          GUARD_FORK=0; [ -n "$PR_HEAD_SHA" ] && [ "$HEAD_REPO" != "$THIS_REPO" ] && GUARD_FORK=1
          export GUARD_FORK
          node "$guard_dir/guard.mjs" --head "$head"
      - name: No secrets in the new commits
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then range="$PR_BASE..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then range="$BEFORE..HEAD"
          else range="$(git tag --list 'v1-abc-*' --merged HEAD --sort=-creatordate | head -1)..HEAD"; fi
          echo "gitleaks range: $range"
          gitleaks git --redact --no-banner --log-opts="$range" .

  coachingcore:
    name: CoachingCore (npm test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: CoachingCore
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # HISTORICAL_TEST_POLICY §4: the record's written-once proof needs the full history
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: CoachingCore/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Official suite (active + historical accounting)
        run: npm test
      - name: Suite left the tree unchanged
        run: test -z "$(git status --porcelain --untracked-files=all)"

  swift:
    name: Swift packages (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: CoachingCore/package-lock.json
      - name: CoachingCore dependencies (the contract tests run the engine through node)
        run: cd CoachingCore && npm ci --ignore-scripts --no-audit --no-fund
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Shared contracts (swift test, 0 skipped) and front packages (build with tests)
        run: tools/orchestration/swift-packages.sh --fronts=build
      - name: App shell detection (simulator pipeline runs on the Mac mini)
        run: |
          set +e; tools/orchestration/sim.sh detect; rc=$?
          if [ $rc -eq 3 ]; then echo "::notice::WAITING_FOR_APP_SHELL — the simulator pipeline activates with front C's app shell"; exit 0; fi
          exit $rc
      - name: Gates left the tree unchanged
        run: test -z "$(git status --porcelain --untracked-files=all)"

  ci:
    name: CI
    if: always()
    needs: [repo, coachingcore, swift]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All required gates passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
